<title>GTC Mid-Cap Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column; a big-number hero and line chart up top, then positions, trades and prices behind a sticky tab bar. Terminal amber marks tickers. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --sunk:#eceef3; --panel:#f6f7fa; --ink:#11161f; --muted:#5b6474; --line:#dfe2e9;
  --accent:#c77700; --accent-soft:#fbefd9; --up:#0e8a55; --up-soft:#e2f4ea; --down:#cf3434; --down-soft:#fbe6e6;
  --shadow:0 1px 2px rgba(17,22,31,.06),0 8px 24px rgba(17,22,31,.06);
  --alert-bg:#d92d20; --alert-fg:#ffffff; --bench:#4f6d9a;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e13; --surface:#141922; --sunk:#1b212c; --panel:#1b212c; --ink:#edf0f5; --muted:#8e98a9; --line:#252c38;
  --accent:#f2a33a; --accent-soft:#3a2a12; --up:#34c486; --up-soft:#11291e; --down:#ff6464; --down-soft:#341819;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --alert-bg:#e5484d; --alert-fg:#ffffff; --bench:#8aa4cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e13; --surface:#141922; --sunk:#1b212c; --panel:#1b212c; --ink:#edf0f5; --muted:#8e98a9; --line:#252c38;
  --accent:#f2a33a; --accent-soft:#3a2a12; --up:#34c486; --up-soft:#11291e; --down:#ff6464; --down-soft:#341819;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --alert-bg:#e5484d; --alert-fg:#ffffff; --bench:#8aa4cc; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:18px}
.top .hero{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.book{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:2px}
.clock{text-align:right;flex:none;padding-top:1px}
.clock .eyebrow{display:block}
.clock b{font-family:var(--f-display);font-size:15px;display:block;margin-top:6px;white-space:nowrap}
.track{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px;width:88px;margin-left:auto}
.track i{display:block;height:100%;background:var(--accent)}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,9vw,52px);white-space:nowrap;line-height:1.05;letter-spacing:-.02em}
.big .cents{font-size:.5em;letter-spacing:0;color:var(--muted);font-weight:500}
.chg{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:600}
.chg span small{font-weight:500;color:var(--muted);margin-left:4px}
.fresh{font-size:12px;color:var(--muted)}
.bmline{min-height:1.5em}
.chg span{white-space:nowrap}
.mouse-only{display:none}
@media (hover:hover) and (pointer:fine){.mouse-only{display:block}}
.sh-name{font-weight:600;font-size:16px;color:var(--muted)}
.sbig{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,9vw,42px);line-height:1.05;letter-spacing:-.02em}

/* chart */
.chart{position:relative;display:flex;flex-direction:column;gap:10px}
.chart svg{display:block;width:100%;height:190px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart-empty{height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:16px}
.ranges{display:flex;gap:4px;flex-wrap:wrap}
.ranges button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.ranges button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;margin-top:4px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--bench);border-radius:1px;vertical-align:middle;margin-right:5px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* notices */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.note b{font-weight:600}
.note button{margin-left:auto;border:0;background:transparent;color:var(--accent);font-weight:600;white-space:nowrap;padding:0}

/* section */
#view{display:flex;flex-direction:column;gap:28px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.sec-h span{font-size:13px;color:var(--muted)}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 16px;border-top:1px solid var(--line);align-items:center;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:transparent}
.row:first-child{border-top:0}
@media (hover:hover){ button.row:hover,a.row.news:hover{background:var(--sunk)} }  /* no sticky hover after a tap on phones */
.r-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.r-val{text-align:right;font-weight:600}
.r-pl{text-align:right;font-size:13px;font-weight:600}
.tk{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.02em}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.pill.buy{background:var(--up-soft);color:var(--up)}
.pill.sell{background:var(--down-soft);color:var(--down)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}
.pill.cap{background:var(--down-soft);color:var(--down)}
.pill.mkt{background:var(--sunk);color:var(--muted)}
.mg{grid-column:1/-1;margin-top:8px;display:grid;font-size:11px;grid-template-columns:6.2em minmax(0,1fr) 6.2em;align-items:center;gap:10px;
  background:var(--panel);border-radius:10px;padding:7px 10px;transition:background .3s}
.mg-none{display:none}
.mg.near-sl{background:var(--down-soft)}
.mg.near-tp{background:var(--up-soft)}
.mg-l{font-weight:600;white-space:nowrap}
.mg-l.up{text-align:right}
.mg-bar{position:relative;height:6px;border-radius:3px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.mg-bar::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.7;background:linear-gradient(90deg,var(--down) 0%,transparent 42%,transparent 58%,var(--up) 100%)}
.mg-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);transform:translate(-50%,-50%);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mg-entry{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--muted);transform:translateX(-50%)}
.pill.hit{background:var(--alert-bg);color:var(--alert-fg)}
.alertbox{background:var(--alert-bg);color:var(--alert-fg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgba(217,45,32,.35)}
.al-h{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px}
.al-i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--alert-fg);color:var(--alert-bg);display:grid;place-items:center;font-weight:800;font-size:15px}
.al-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:baseline;text-align:left;border:0;border-radius:10px;padding:9px 10px;background:rgba(255,255,255,.16);color:inherit}
.al-row:hover{background:rgba(255,255,255,.26)}
.al-k{font-size:11px;font-weight:800;letter-spacing:.06em}
.al-n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-d{grid-column:2;font-size:13px;opacity:.92}
.al-f{font-size:12px;opacity:.9}
.tabs button.alert{color:var(--alert-bg)}
.tabs button.alert[aria-selected="true"]{color:var(--alert-bg)}
.bang{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--alert-bg);color:var(--alert-fg);font-size:12px;font-weight:800;margin-left:4px;vertical-align:1px}
.chart-foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.chart-foot .legend{margin:0;transition:opacity .2s}
.chart-foot .legend.dim{opacity:.45}
.lvtog{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer;user-select:none;width:max-content}
.lvtog input{position:absolute;opacity:0;width:1px;height:1px}
.xh{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;visibility:hidden}
.xh i{position:absolute;left:0;top:0;will-change:transform;backface-visibility:hidden}
.xh .xl{width:1px;margin-left:-.5px;background:var(--muted)}
.xh .xd{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--surface);box-sizing:border-box}
.lvtog .sw{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s;flex:none}
.lvtog .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.lvtog input:checked+.sw{background:var(--accent)}
.lvtog input:checked+.sw::after{transform:translateX(16px)}
.lvtog input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.lvbox{display:flex;flex-direction:column;gap:10px}
.lvinfo{min-height:62px;font-size:12px;font-weight:600}
.g-off{color:var(--muted);font-weight:500;font-size:13px;padding-top:4px}
.gauge{position:relative;padding-top:20px}
.g-now{position:absolute;top:0;font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink)}
.g-bar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--down) 0%,var(--down-soft) 30%,var(--sunk) 50%,var(--up-soft) 70%,var(--up) 100%)}
.g-dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.g-entry{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted);transform:translateX(-50%);border-radius:1px}
.g-ends{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;margin-top:8px}
.g-ends>span{display:flex;flex-direction:column;gap:1px;min-width:0}
.g-ends>span:nth-child(2){align-items:center;text-align:center}
.g-ends>span:last-child{align-items:flex-end;text-align:right}
.g-ends b{font-weight:700}
.lvinfo b{font-weight:700}
a.row.news{display:block;color:inherit;text-decoration:none}
.row.ev{grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px}
.ev-d{grid-row:1/3;width:46px;padding:6px 0 5px;border-radius:10px;background:var(--sunk);text-align:center;line-height:1.05}
.ev-d small{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ev-d b{font-family:var(--f-display);font-size:19px;font-weight:700}
.ev.earn .ev-d{background:var(--accent-soft,var(--sunk))}
.ev .r-name{white-space:normal}
.ev-w{font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.ev-w.soon{color:var(--accent)}
.ev .r-sub{grid-column:2/4}
.ev-after{color:var(--muted);font-weight:500}
.nf{display:flex;gap:8px;align-items:stretch}
.nf-all{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 16px;font-weight:700;color:var(--muted)}
.nf-all b{font-weight:500;margin-left:4px;opacity:.7}
.nf-all[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nf-dd{position:relative;flex:1;min-width:0}
.nf-btn{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600;color:var(--muted);text-align:left}
.nf-btn.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.nf-btn .nf-cur{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nf-btn i,.nf-list i{font-style:normal;font-size:11px;color:var(--accent)}
.nf-btn[aria-expanded="true"] .nf-chev{transform:rotate(180deg)}
.nf-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
.nf-pop[hidden]{display:none}
.nf-pop input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.nf-list{max-height:300px;overflow:auto;display:flex;flex-direction:column}
.nf-list button{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border:0;background:transparent;border-radius:9px;padding:9px 10px;text-align:left;font-weight:600}
.nf-list button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nf-list button b{font-weight:500;color:var(--muted);font-size:13px;min-width:1.5em;text-align:right}
.nf-list button:hover,.nf-list button[aria-selected="true"]{background:var(--sunk)}
a.row.news:hover{background:var(--sunk)}
.news-t{white-space:normal;line-height:1.35;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;max-width:100%}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent);white-space:nowrap}
.mrow{grid-template-columns:minmax(0,1fr) auto}
.wbar{grid-column:1/-1;height:3px;background:var(--sunk);border-radius:2px;position:relative;margin-top:4px}
.wbar i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:2px;opacity:.55}
.wbar i.over{background:var(--down);opacity:1}
.wbar u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--down);text-decoration:none;opacity:.6}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.stats div{background:var(--surface);padding:12px 14px;min-width:0}
.stats small{display:block;font-size:12px;color:var(--muted)}
.stats b{display:block;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--down);border-color:var(--down-soft)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:10px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;border:0;background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:999px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;touch-action:none;overscroll-behavior:contain}
.sheet{cursor:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet>*{flex-shrink:0}
.stats b small{display:inline;font-size:12px;font-weight:500;color:var(--muted)}
.stats b.two{white-space:normal;line-height:1.3}
.x{position:sticky;top:0;align-self:flex-end;margin-bottom:-50px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);font-size:16px;line-height:36px;padding:0;flex:none}
#sChart svg{display:block;width:100%;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.veil{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:0}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.f .hint{font-weight:400;font-size:12px}
.calc{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions .grow{flex:1}
.err{color:var(--down);font-size:14px;font-weight:600}
.pxrow{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pxrow input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:rise .36s cubic-bezier(.32,.72,0,1)}
  .sheet.stagger>*{animation-duration:.36s}
  .veil{animation:veilIn .2s ease-out}
  .veil.closing{animation:veilOut .22s ease-in forwards}
  .veil.closing .sheet{animation:sink .22s cubic-bezier(.4,0,1,1) forwards}
  #view.enter{animation:viewIn .22s ease-out}
  .r-val.flash-up{animation:flashUp 1.4s ease-out}
  .r-val.flash-down{animation:flashDown 1.4s ease-out}

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const S = {
  db:null, user:null, myId:null, canWrite:true, dbState:"loading",
  trades:[], prices:[], settings:{startCapital:1000000,start:"2026-10-14",end:"2026-11-13",name:"Europe Group A"},
  got:{trades:false,prices:false}, tab:"overview", range:"all", names:{},
  market:{latest:null,history:null}, stockRange:"1d", news:null, newsFilter:"all", levels:{}, showLevels:true, showBench:false
};
try{ const t = localStorage.getItem("gtc.tab"); if(t) S.tab=t; const r = localStorage.getItem("gtc.range"); if(r==="1d"||r==="7"||r==="all") S.range=r; const sr=localStorage.getItem("gtc.srange"); if(["1d","1w","1m","ytd","1y","max"].includes(sr)) S.stockRange=sr; const nf=localStorage.getItem("gtc.nf"); if(nf) S.newsFilter=nf; }catch(e){}

/* ---------- motion ---------- */
const RM=()=>!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function makeSmoother(draw){
  let cur=null, tgt=null, meta=null, raf=0;
  const tick=()=>{ raf=0; if(cur==null) return; const d=tgt-cur;
    if(Math.abs(d)<=Math.max(0.005,Math.abs(tgt)*1e-6)){ cur=tgt; draw(cur,meta); return; }
    cur+=d*0.28; draw(cur,meta); raf=requestAnimationFrame(tick); };
  return { set(v,m){ tgt=v; meta=m; if(cur==null||RM()){ cur=v; draw(cur,meta); return; } if(!raf) raf=requestAnimationFrame(tick); },
           reset(){ cur=null; if(raf) cancelAnimationFrame(raf); raf=0; } };
}
let scrubbing=false, renderDeferred=false, sheetRefresh=null;  /* while a finger is on a chart, refreshes wait */
/* live updates never redraw the page mid-scroll: they wait until scrolling has stopped */
let scrollGen=0, lastScrollT=0, rsT=0; document.addEventListener("scroll",()=>{ scrollGen++; lastScrollT=performance.now(); },{capture:true,passive:true});
const scrollingNow=()=>performance.now()-lastScrollT<300;
function renderSoon(){ if(scrubbing){ renderDeferred=true; return; } if(scrollingNow()){ clearTimeout(rsT); rsT=setTimeout(renderSoon,320); return; } render(); }
function setHTML(el,h){ if(el && el.__h!==h){ el.innerHTML=h; el.__h=h; } }
/* moves the selection pill of a segmented control to the active button */
function slidePill(box,activeSel){
  if(!box) return; let ind=box.querySelector(":scope>.slide-ind");
  if(!ind){ ind=document.createElement("i"); ind.className="slide-ind"; ind.setAttribute("aria-hidden","true"); box.prepend(ind); box.classList.add("has-ind"); }
  const a=box.querySelector(activeSel); if(!a||!a.offsetWidth){ ind.style.opacity="0"; return; }
  const first=!ind.__on; ind.__on=true;
  if(first) ind.style.transition="none";
  ind.style.width=a.offsetWidth+"px"; ind.style.height=a.offsetHeight+"px";
  ind.style.transform=`translate(${a.offsetLeft}px,${a.offsetTop}px)`; ind.style.opacity="1";
  if(first){ void ind.offsetWidth; ind.style.transition=""; }
}
function pills(){ slidePill($(".tabs"),'[aria-selected="true"]'); slidePill($("#ranges"),'[aria-pressed="true"]'); slidePill($("#sRanges"),'[aria-pressed="true"]'); slidePill($("#side"),'[aria-pressed="true"]'); }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ document.querySelectorAll(".slide-ind").forEach(i=>i.__on=false); pills(); });
document.addEventListener("touchstart",()=>{},{passive:true});  /* lets iPhone Safari show :active press states */
function staggerIn(el){ if(!el||RM()) return; el.classList.remove("stagger"); void el.offsetWidth; el.classList.add("stagger"); clearTimeout(el.__st); el.__st=setTimeout(()=>el.classList.remove("stagger"),800); }
function retrigger(el,cls){ if(!el||RM()) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------- formatting ---------- */
const usd0 = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const usd2 = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
const n2 = new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const nPx = v => new Intl.NumberFormat("en-US",{maximumFractionDigits: v>=1000?1: v>=10?2:4, minimumFractionDigits: v>=1000?0:2}).format(v);
const nSh = v => new Intl.NumberFormat("en-US",{maximumFractionDigits: v>=100?0:2}).format(v);
const sign = v => v>0.0000001?"+":(v<-0.0000001?"−":"");
const fmtUsdS = v => sign(v)+usd2.format(Math.abs(v));
const fmtPct = v => sign(v)+n2.format(Math.abs(v*100))+"%";
const cls = v => v>0.0000001?"up":(v<-0.0000001?"down":"flat");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-"); return (+dd)+" "+MONTHS[+m-1]; };
function today(){ const d=new Date(); const p=x=>String(x).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
const dayNum = d => Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/864e5;
const num = v => { if(v===""||v==null) return null; const x=Number(String(v).replace(/,/g,"").trim()); return isFinite(x)?x:null; };

/* Bloomberg exchange code -> trading currency */
const CCY = {US:"USD",UN:"USD",UW:"USD",UQ:"USD",UR:"USD",UA:"USD",UP:"USD",JT:"JPY",TT:"TWD",SW:"CHF",SE:"CHF",VX:"CHF",
  GY:"EUR",GR:"EUR",GF:"EUR",BB:"EUR",NA:"EUR",FP:"EUR",IM:"EUR",SM:"EUR",ID:"EUR",PL:"EUR",AV:"EUR",FH:"EUR",
  SS:"SEK",NO:"NOK",DC:"DKK",LN:"GBP",AU:"AUD",AT:"AUD",HK:"HKD",CN:"CAD",CT:"CAD",KS:"KRW",SP:"SGD",TB:"THB",SJ:"ZAR",PM:"PHP",IJ:"IDR",MK:"MYR"};
const guessCcy = t => { const p=String(t||"").trim().toUpperCase().split(/\s+/); return CCY[p[p.length-1]]||""; };

/* ---------- price feed ---------- */
const feedPx = () => (S.market.history&&S.market.history.px)||{};
const feedFx = () => (S.market.history&&S.market.history.fx)||{};
const livePx = () => (S.market.latest&&S.market.latest.px)||{};
const liveFx = () => (S.market.latest&&S.market.latest.fx)||{};
function feedFxAt(ccy,d){
  if(ccy==="USD") return 1;
  let v=null; for(const [dd,c] of (feedFx()[ccy]||[])){ if(dd<=d) v=c; else break; }
  const l=liveFx()[ccy]; if(l && l.d<=d && (v==null || l.d>=d)) v=l.v;
  return v;
}
/* Fill estimate for a buy without a fill price: US listings at that day's close
   (orders went in during US hours), everything else at the next session's open. */
function estimateFill(t){
  if(t.estPrice>0) return {date:t.estDate||t.date, price:t.estPrice, fx: t.ccy==="USD"?1:(t.estFx||feedFxAt(t.ccy,t.estDate||t.date)||t.fx), ts:t.estTs||null};
  const rows=feedPx()[t.ticker]||[], L=livePx()[t.ticker];
  let date=null, price=null;
  if(t.ccy==="USD"){
    const r=rows.find(x=>x[0]===t.date);
    if(r){ date=r[0]; price=r[2]; } else if(L && L.d===t.date){ date=L.d; price=L.p; }
  } else {
    const r=rows.find(x=>x[0]>t.date && x[1]>0);
    if(r){ date=r[0]; price=r[1]; } else if(L && L.d>t.date && L.o>0){ date=L.d; price=L.o; }
  }
  if(!(price>0)) return null;
  return {date, price, fx: feedFxAt(t.ccy,date) || t.fx};
}
let EFF=null;
function effTrades(){
  if(EFF) return EFF;
  EFF = S.trades.map(t=>{
    if(t.side==="BUY" && !(t.price>0)){
      const e=estimateFill(t);
      if(e) return Object.assign({},t,{price:e.price,fx:t.ccy==="USD"?1:e.fx,effDate:e.date,effTs:e.ts||null,est:true});
    }
    return Object.assign({},t,{effDate:t.fillDate||t.date,effTs:t.fillTs||null});  // real fill: counts from its fill time
  });
  return EFF;
}

/* ---------- engine ---------- */
function sortedTrades(){
  return effTrades().slice().sort((a,b)=> a.effDate<b.effDate?-1:a.effDate>b.effDate?1: String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
}
const RANK={fill:0,feed:1,live:2,mark:3};
function buildObs(){
  const px={}, fx={};
  const push=(o,k,v)=>{ (o[k]=o[k]||[]).push(v); };
  for(const t of effTrades()){
    if(t.price>0) push(px,t.ticker,{date:t.effDate,v:t.price,src:"fill"});
    if(t.ccy && t.ccy!=="USD" && t.fx>0) push(fx,t.ccy,{date:t.effDate,v:t.fx,src:"fill"});
  }
  const fp=feedPx(); for(const k in fp) for(const r of fp[k]) if(r[2]>0) push(px,k,{date:r[0],v:r[2],src:"feed"});
  const ff=feedFx(); for(const k in ff) for(const r of ff[k]) if(r[1]>0) push(fx,k,{date:r[0],v:r[1],src:"feed"});
  const lp=livePx(); for(const k in lp) if(lp[k].p>0) push(px,k,{date:lp[k].d,v:lp[k].p,src:"live"});
  const lf=liveFx(); for(const k in lf) if(lf[k].v>0) push(fx,k,{date:lf[k].d,v:lf[k].v,src:"live"});
  for(const p of S.prices){
    for(const k in (p.px||{})) if(p.px[k]>0) push(px,k,{date:p.date,v:p.px[k],src:"mark"});
    for(const k in (p.fx||{})) if(p.fx[k]>0) push(fx,k,{date:p.date,v:p.fx[k],src:"mark"});
  }
  const srt=o=>{for(const k in o) o[k].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:RANK[a.src]-RANK[b.src]);};
  srt(px); srt(fx);
  return {px,fx};
}
function at(arr,d){ if(!arr) return null; let r=null; for(const o of arr){ if(o.date<=d) r=o; else break; } return r; }

function run(d, obs){
  const pos={}, results={}; let cash=S.settings.startCapital||0, realized=0;
  for(const t of sortedTrades()){
    if(t.effDate>d) break;
    const p = pos[t.ticker] = pos[t.ticker] || {ticker:t.ticker,name:t.name,ccy:t.ccy,shares:0,cost:0,pending:0,pendingIds:[],est:false};
    if(t.est) p.est=true;
    p.name=t.name||p.name; p.ccy=t.ccy||p.ccy;
    const fx = t.ccy==="USD"?1:t.fx;
    if(t.side==="BUY"){
      const usd=+t.usd||0;
      cash-=usd;
      if(t.price>0 && fx>0){ p.shares += usd/(t.price*fx); p.cost += usd; }
      else { p.pending += usd; p.pendingIds.push(t.id); }
    } else if(t.side==="SELL"){
      const sh = Math.min(+t.shares||0, p.shares);
      if(!(t.price>0 && fx>0) || sh<=0){ results[t.id]={invalid:true}; continue; }
      const proceeds = sh*t.price*fx;
      const avg = p.shares>0 ? p.cost/p.shares : 0;
      const costOut = avg*sh, pl = proceeds-costOut;
      realized+=pl; cash+=proceeds; p.shares-=sh; p.cost-=costOut;
      if(p.shares<1e-7){ p.shares=0; p.cost=0; }
      results[t.id]={proceeds,pl,ret: costOut>0?pl/costOut:0, shares:sh};
    }
  }
  let invested=0; const list=[];
  for(const k in pos){
    const p=pos[k];
    if(p.shares<=0 && p.pending<=0) continue;
    const po=at(obs.px[k],d), fo = p.ccy==="USD"?{v:1}:at(obs.fx[p.ccy],d);
    let mv = p.cost;
    if(p.shares>0 && po && fo) mv = p.shares*po.v*fo.v;
    p.px = po?po.v:null; p.pxDate = po?po.date:null; p.fxNow = fo?fo.v:null;
    p.value = mv + p.pending; p.unreal = mv - p.cost;
    invested += p.value; list.push(p);
  }
  return {cash, realized, positions:list, total: cash+invested, results};
}

function compute(){
  EFF=null;
  const obs=buildObs(), td=today();
  const start=S.settings.start||td;
  const dates=new Set([start]);
  effTrades().forEach(t=>dates.add(t.effDate));
  S.prices.forEach(p=>dates.add(p.date));
  const fp=feedPx(); for(const k in fp) for(const r of fp[k]) dates.add(r[0]);
  const lp=livePx(); for(const k in lp) dates.add(lp[k].d);
  const ds=[...dates].filter(d=>d>=start && d<=td).sort();
  const curve = ds.map(d=>({date:d,v:run(d,obs).total}));
  const now = run(td,obs);
  // benchmark
  const bench = S.prices.filter(p=>p.bench>0).sort((a,b)=>a.date<b.date?-1:1);
  const benchPts = bench.map(p=>({date:p.date,v:p.bench}));
  // lot results for buys
  const lots={};
  for(const t of effTrades()){
    if(t.side!=="BUY") continue;
    const p = now.positions.find(x=>x.ticker===t.ticker);
    const fx = t.ccy==="USD"?1:t.fx;
    if(!(t.price>0 && fx>0)){ lots[t.id]={pending:true}; continue; }
    if(!p || p.shares<=0){ lots[t.id]={closed:true,est:t.est}; continue; }
    if(!(p.px>0 && p.fxNow>0)){ lots[t.id]={nomark:true,est:t.est}; continue; }
    const ret = (p.px*p.fxNow)/(t.price*fx)-1;
    lots[t.id]={ret, pl:(+t.usd||0)*ret, est:t.est, price:t.price, effDate:t.effDate};
  }
  return {obs, curve, now, lots, benchPts, td};
}

/* ---------- render: header + hero ---------- */
function renderClock(){
  const s=S.settings, td=today();
  const a=dayNum(s.start), b=dayNum(s.end), c=dayNum(td);
  const total=b-a, left=Math.max(0,b-c);
  let lbl="Challenge", val;
  if(c<a){ val="Starts "+fmtDate(s.start); }
  else if(c>b){ lbl="Challenge"; val="Finished"; }
  else { lbl="Ends "+fmtDate(s.end); val= left===0?"Last day": left+" day"+(left===1?"":"s")+" left"; }
  $("#clockLbl").textContent=lbl; $("#clockVal").textContent=val;
  $("#clockBar").style.width = Math.max(0,Math.min(100,(c-a)/total*100))+"%";
}

function valueAt(cv,d){ let r=null; for(const p of cv){ if(p.date<=d) r=p.v; } return r; }

/* ---------- shared line chart (dotted start line, touch to scrub) ---------- */
function calcRange(vals){
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi-lo<=0){ const e=Math.abs(hi)*0.01||1; hi+=e; lo-=e; }
  const pad=(hi-lo)*0.1; return {lo:lo-pad,hi:hi+pad};
}
function lineChart(box,pts,base,opts){
  opts=opts||{};
  const W=Math.max(260,box.clientWidth||400), H=opts.h||190, pT=14, pB=14;
  const marks=opts.markers||[], bench=opts.bench||[], hl=opts.levels||[];
  const rg=opts.range||calcRange(pts.map(p=>p.v).concat(bench.map(p=>p.v),marks.map(m=>m.v),[base]));
  const lo=rg.lo, hi=rg.hi;
  const x0=pts[0].x, x1=pts[pts.length-1].x;
  const X=x=>3+(x1===x0?0.5:(x-x0)/(x1-x0))*(W-12), Y=v=>pT+(1-(v-lo)/(hi-lo))*(H-pT-pB);
  const last=pts[pts.length-1].v, col=last>=base?"var(--up)":"var(--down)";
  const path=a=>a.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const pctAxis=()=>{ const rl=(lo/base-1)*100, rh=(hi/base-1)*100, span=rh-rl;
    const st=[0.25,0.5,1,2,5,10,20,50,100].find(x=>span/x<=4)||200; let o="";
    for(let k=Math.ceil(rl/st);k*st<=rh;k++){ if(k===0) continue; const y=Y(base*(1+k*st/100)); if(y<pT-4||y>H-pB+4) continue;
      o+=`<line x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="3" y="${(y-3).toFixed(1)}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${k>0?"+":"−"}${Math.abs(k*st)}%</text>`; }
    const y0=Y(base); return o+`<text x="3" y="${(y0-4).toFixed(1)}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">0%</text>`; };
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opts.aria||"Price chart")}">
    <rect class="sel" x="0" y="0" width="0" height="${H}" fill="var(--ink)" fill-opacity=".07" visibility="hidden"/>
    <line x1="2" x2="${W-2}" y1="${Y(base).toFixed(1)}" y2="${Y(base).toFixed(1)}" stroke="var(--muted)" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0 7"/>
    ${opts.pctAxis?pctAxis():""}
    ${bench.length>1?`<g opacity="${opts.benchOpacity==null?1:opts.benchOpacity}"><path d="${path(bench)}" fill="none" stroke="var(--bench)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(bench[bench.length-1].x).toFixed(1)}" cy="${Y(bench[bench.length-1].v).toFixed(1)}" r="3.5" fill="var(--bench)"/></g>`:""}
    <g class="lvl${opts.levelsIn&&!RM()?" lv-in":""}">${hl.map(l=>{
      if(l.v>=lo && l.v<=hi){  // inside the visible range: dashed line
        const y=Y(l.v).toFixed(1), ty=Math.max(11,Math.min(H-4,+y+(l.below?13:-5)));
        return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="${l.color}" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="${W-4}" y="${ty}" text-anchor="end" font-size="11" font-weight="700" fill="${l.color}" font-family="IBM Plex Mono, monospace">${esc(l.label)}</text>`; }
      const up=l.v>hi;  // off-chart: small marker pinned to the edge, chart scale untouched
      return `<text x="${W-4}" y="${up?11:H-3}" text-anchor="end" font-size="11" font-weight="700" fill="${l.color}" font-family="IBM Plex Mono, monospace">${up?"▲":"▼"} ${esc(l.label)}</text>`; }).join("")}</g>
    <path class="main" d="${path(pts)}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks.map(m=>`<circle cx="${X(m.x).toFixed(1)}" cy="${Y(m.v).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
    <circle cx="${X(pts[pts.length-1].x).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="4" fill="${col}"/>
    <g class="c2" visibility="hidden"><line class="c2l" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><circle class="c2c" r="5" stroke="var(--surface)" stroke-width="2"/></g>
    <text class="selt" y="13" text-anchor="middle" font-size="12" font-weight="700" font-family="IBM Plex Mono, monospace" visibility="hidden"></text>
    <rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="xh" aria-hidden="true"><i class="xl"></i><i class="xd" style="background:${col}"></i></div>`;
  if(getComputedStyle(box).position==="static") box.style.position="relative";
  const svg=box.querySelector("svg"), hit=svg.querySelector(".hit");
  /* the finger cursor is an HTML layer on top of the chart, moved by the GPU only: the line chart itself is never redrawn while scrubbing */
  const xh=box.querySelector(".xh"), xl=xh.querySelector(".xl"), xd=xh.querySelector(".xd");
  if(opts.drawIn && !RM()){ const mp=svg.querySelector(".main");
    try{ const L=mp.getTotalLength(); mp.style.strokeDasharray=L; mp.style.strokeDashoffset=L; mp.getBoundingClientRect();
      mp.style.transition="stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"; mp.style.strokeDashoffset="0";
      setTimeout(()=>{ mp.style.strokeDasharray=""; mp.style.transition=""; },700); svg.classList.add("drawing"); }catch(e){} }
  const sel=svg.querySelector(".sel"), c2=svg.querySelector(".c2"), selT=svg.querySelector(".selt");
  /* smooth scrubbing: cursor follows the finger continuously, dot glides along the line,
     figures come from the nearest real data point; DOM writes batched to one per frame */
  const XS=pts.map(p=>X(p.x));
  let rect=null, rectGen=-1, kx=1, ky=1;
  const measure=()=>{ rect=svg.getBoundingClientRect(); rectGen=scrollGen;  /* measured once per touch (and after a scroll), not every frame */
    const br=box.getBoundingClientRect(); kx=rect.width/W; ky=rect.height/H;
    xh.style.left=(rect.left-br.left+box.scrollLeft)+"px"; xh.style.top=(rect.top-br.top+box.scrollTop)+"px"; xl.style.height=rect.height+"px"; };
  const svgX=e=>{ if(!rect||rectGen!==scrollGen) measure(); const r=rect; return Math.max(XS[0],Math.min(XS[XS.length-1],(e.clientX-r.left)*(W/r.width))); };
  const idxAt=x=>{ let a=0,b=XS.length-1; while(b-a>1){ const m=(a+b)>>1; if(XS[m]<=x) a=m; else b=m; } return [a,b]; };
  const nearest=e=>{ const x=svgX(e), [a,b]=idxAt(x); return (x-XS[a]<=XS[b]-x)?pts[a]:pts[b]; };
  const yAt=x=>{ const [a,b]=idxAt(x), t=XS[b]===XS[a]?0:(x-XS[a])/(XS[b]-XS[a]); return Y(pts[a].v+(pts[b].v-pts[a].v)*t); };
  let curOn=false;
  const putCur=(x,y)=>{ if(!curOn){ xh.style.visibility="visible"; curOn=true; scrubbing=true; } const px=(x*kx).toFixed(2);
    xl.style.transform="translate3d("+px+"px,0,0)"; xd.style.transform="translate3d("+px+"px,"+(y*ky).toFixed(2)+"px,0)"; };
  const hideSel=()=>{ sel.setAttribute("visibility","hidden"); c2.setAttribute("visibility","hidden"); selT.setAttribute("visibility","hidden"); };
  const showRange=(a,b)=>{
    const [p,q]=a.x<=b.x?[a,b]:[b,a], x1=X(p.x), x2=X(q.x), d=q.v-p.v, rc=d>=0?"var(--up)":"var(--down)";
    sel.setAttribute("x",x1); sel.setAttribute("width",Math.max(0,x2-x1)); sel.setAttribute("visibility","visible");
    const o=a===p?a:b; c2.setAttribute("visibility","visible");
    const l2=svg.querySelector(".c2l"); l2.setAttribute("x1",X(a.x)); l2.setAttribute("x2",X(a.x));
    const k2=svg.querySelector(".c2c"); k2.setAttribute("cx",X(a.x)); k2.setAttribute("cy",Y(a.v)); k2.setAttribute("fill",rc);
    selT.textContent=fmtPct(p.v?d/p.v:0); selT.setAttribute("fill",rc);
    selT.setAttribute("x",Math.min(W-30,Math.max(30,(x1+x2)/2))); selT.setAttribute("visibility",x2-x1>4?"visible":"hidden");
    if(opts.onRange) opts.onRange(p,q); };
  /* the line is moved inside the touch/mouse event itself (no wait for the next frame), and placed where the
     finger will be when the frame reaches the screen: the browser's own prediction where available
     (Chrome, Edge, Android), else a short velocity look-ahead; it settles on the exact spot as soon as you stop */
  let A=null, frozen=false, lastPt=null, vx=0, lastX=null, lastT=0, settle=0;
  const LEAD=16, MAXLEAD=24;  /* ms ahead, css px cap */
  const apply=(cx,buttons)=>{ const e={clientX:cx};
    const x=svgX(e), b=nearest(e);
    if(A && (buttons&1)){ putCur(x,yAt(x)); if(b!==lastPt){ lastPt=b; showRange(A,b); } return; }
    if(frozen) return;
    putCur(x,yAt(x));
    if(opts.onScrub){ const [i,j]=idxAt(x), t=XS[j]===XS[i]?0:(x-XS[i])/(XS[j]-XS[i]);
      opts.onScrub({v:pts[i].v+(pts[j].v-pts[i].v)*t, x:pts[i].x+(pts[j].x-pts[i].x)*t, label:b.label}); } };
  const mv=e=>{
    const cx=e.clientX, t=e.timeStamp;
    if(lastX==null || t-lastT>=100){ vx=0; lastX=cx; lastT=t; }
    else if(t-lastT>=4){ const v=(cx-lastX)/(t-lastT); vx=vx*0.4+v*0.6; lastX=cx; lastT=t; }  /* events closer than 4 ms: keep the speed, avoid spikes */
    let px=cx; const pr=e.getPredictedEvents?e.getPredictedEvents():[];
    if(pr && pr.length) px=pr[pr.length-1].clientX;
    else px=cx+Math.max(-MAXLEAD,Math.min(MAXLEAD,vx*LEAD));
    apply(px,e.buttons);
    clearTimeout(settle); const bt=e.buttons;
    if(px!==cx) settle=setTimeout(()=>{ if(curOn){ vx=0; apply(cx,bt); } },50); };
  const lv=()=>{ if(A) return; clearTimeout(settle); lastX=null; vx=0; lastPt=null; frozen=false; rect=null; curOn=false; hideSel(); xh.style.visibility="hidden"; scrubbing=false; if(opts.onLeave) opts.onLeave();
    if(renderDeferred){ renderDeferred=false; setTimeout(render,0); } };
  hit.addEventListener("pointerenter",measure);
  /* touch: an up/down swipe scrolls the page (the browser takes it over), a sideways swipe or a short hold scrubs */
  let tp=null;
  const startScrub=(cx)=>{ tp=null; mv({clientX:cx,timeStamp:performance.now(),buttons:1}); };
  hit.addEventListener("pointerdown",e=>{ measure(); lastX=null; vx=0;
    if(e.pointerType==="touch"){ const cx=e.clientX; tp={x0:cx,y0:e.clientY,cx,timer:setTimeout(()=>{ if(tp) startScrub(tp.cx); },170)}; return; }
    if(e.pointerType==="mouse"){ frozen=false; hideSel(); A=nearest(e); try{hit.setPointerCapture(e.pointerId);}catch(_){} }
    mv(e); });
  hit.addEventListener("pointerup",e=>{ if(!A) return; const b=nearest(e); frozen=b!==A; if(!frozen){ hideSel(); } A=null; });
  hit.addEventListener("pointermove",e=>{
    if(tp){ tp.cx=e.clientX; const dx=Math.abs(e.clientX-tp.x0), dy=Math.abs(e.clientY-tp.y0);
      if(dx>=4 && dx>dy){ clearTimeout(tp.timer); tp=null; mv(e); }
      return; }
    mv(e); });
  const endTouch=()=>{ if(tp){ clearTimeout(tp.timer); tp=null; } };
  hit.addEventListener("pointerleave",()=>{ endTouch(); lv(); }); hit.addEventListener("pointercancel",()=>{ endTouch(); A=null; lv(); });
  return {lo,hi};
}

/* ---------- portfolio over the selected period ---------- */
const hhmm = ts => new Date(ts*1000).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const dhm = ts => new Date(ts*1000).toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"});
/* midnight today, German time (unix seconds) */
function berlinMidnight(){
  const now=new Date(), o={};
  new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"})
    .formatToParts(now).forEach(x=>o[x.type]=x.value);
  const wall=Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second);
  const offset=wall-Math.floor(now.getTime()/1000)*1000;
  return Math.floor((Date.UTC(+o.year,+o.month-1,+o.day)-offset)/1000);
}
function intradayCurve(C,key,spanH,fromTs){
  key=key||"i"; spanH=spanH||24;
  const L=S.market.latest; if(!L) return [];
  const now=Math.floor(Date.now()/1000), from=fromTs||now-spanH*3600;
  let fixed=C.now.cash; const legs=[]; const grid=new Set([from]);
  const stepAt=(bars,t,v0)=>{ let v=v0; for(const b of bars){ if(b[0]<=t) v=b[1]; else break; } return v; };
  for(const p of C.now.positions){
    fixed+=p.pending;
    if(!(p.shares>0)) continue;
    const bars=(((L.px||{})[p.ticker]||{})[key]||[]).slice().sort((a,b)=>a[0]-b[0]);
    const fxb=p.ccy==="USD"?[]:((((L.fx||{})[p.ccy]||{})[key]||[]).slice().sort((a,b)=>a[0]-b[0]));
    const rows=feedPx()[p.ticker]||[];
    /* no trading since the start of the window (weekend, night): start at today's official price, so a closed market shows 0% */
    const quiet=!bars.some(b=>b[0]>=from&&b[0]<=now), fxQuiet=!fxb.some(b=>b[0]>=from&&b[0]<=now);
    const px0=quiet&&p.px>0?p.px:((bars.filter(b=>b[0]<from).pop()||[])[1] ?? (rows.length?rows[rows.length-1][2]:p.px));
    const fx0=p.ccy==="USD"?1:(fxQuiet&&p.fxNow>0?p.fxNow:((fxb.filter(b=>b[0]<from).pop()||[])[1] ?? p.fxNow));
    if(!(px0>0 && fx0>0)) { fixed+=p.value-p.pending; continue; }
    bars.concat(fxb).forEach(b=>{ if(b[0]>=from && b[0]<=now) grid.add(b[0]); });
    // before the first fill the money was still cash, so the leg counts at cost
    const fb=effTrades().filter(t=>t.ticker===p.ticker&&t.side==="BUY"&&t.price>0).sort((a,b)=>a.effDate<b.effDate?-1:1)[0];
    let fillTs=fb?dayNum(fb.effDate)*86400:0;
    if(fb&&fb.effTs) fillTs=fb.effTs;
    else if(fb&&fb.est){ if(p.ccy==="USD") fillTs+=20*3600; else { const f=bars.find(b=>b[0]>=fillTs-3*3600); if(f) fillTs=f[0]; } }
    if(fillTs>from&&fillTs<=now) grid.add(fillTs);
    const inW=b=>b[0]>=from&&b[0]<=now;  /* earlier bars are already in px0/fx0 */
    legs.push({sh:p.shares,bars:bars.filter(inW),fxb:fxb.filter(inW),any:bars.length>0,px0,fx0,usd:p.ccy==="USD",fillTs,cost:p.cost});
  }
  if(!legs.some(l=>l.any)) return [];
  const ts=[...grid].sort((a,b)=>a-b);
  const pts=ts.map(t=>({x:t/86400,v:fixed+legs.reduce((s,l)=>s+(t<l.fillTs?l.cost:l.sh*stepAt(l.bars,t,l.px0)*(l.usd?1:stepAt(l.fxb,t,l.fx0))),0),label:dhm(t)}));
  pts.push({x:now/86400,v:C.now.total,label:"Now"});
  return pts;
}
/* when the book started: the first order (charts never reach back before it) */
function portfolioStart(){
  const ts=S.trades.map(t=>t.estTs||Date.parse(t.createdAt||"")/1000).filter(x=>x>0);
  return ts.length?Math.min(...ts):dayNum(S.settings.start)*86400;
}
function rangePoints(C){
  const st=portfolioStart(), now=Date.now()/1000, since="since "+fmtDate(S.settings.start), cap=S.settings.startCapital;
  const fromStart=pts=>{ if(pts.length&&cap){ pts[0]=Object.assign({},pts[0],{v:cap}); } return {pts,intraday:true,base:cap||(pts[0]&&pts[0].v),label:since}; };
  if(S.range==="1d"){ const m=berlinMidnight(), pts=intradayCurve(C,"i",24,Math.max(m,st));
    if(st>m) return fromStart(pts); return {pts,intraday:true,base:pts.length?pts[0].v:C.now.total,label:"today"}; }
  if(S.range==="7"){ const w=now-7*86400, pts=intradayCurve(C,"w",168,Math.max(w,st));
    if(pts.length>=2) return st>w?fromStart(pts):{pts,intraday:true,base:pts[0].v,label:"past week"}; }
  if(S.range==="all" && now-st<7*86400){ const pts=intradayCurve(C,"w",168,st); if(pts.length>=2) return fromStart(pts); }
  let pts=C.curve.map(p=>({x:dayNum(p.date),v:p.v,date:p.date,label:fmtDate(p.date)}));
  if(S.range==="7"){
    const cut=dayNum(C.td)-7, inR=pts.filter(p=>p.x>=cut), before=pts.filter(p=>p.x<cut).pop();
    pts=before?[before,...inR]:inR;
    return {pts,intraday:false,base:pts.length?pts[0].v:C.now.total,label:"past week"};
  }
  return {pts,intraday:false,base:S.settings.startCapital||C.now.total,label:"since "+fmtDate(S.settings.start)};
}

/* ---------- hero ---------- */
function bigMoney(v,ccy){
  if(ccy && ccy!=="USD"){ return esc(new Intl.NumberFormat("en-US",{style:"currency",currency:ccy,maximumFractionDigits:v>=1000?0:2}).format(v)); }
  const whole=Math.floor(Math.abs(v)), cents=Math.round((Math.abs(v)-whole)*100);
  return (v<0?"−":"")+usd0.format(whole)+'<span class="cents">.'+String(Math.min(cents,99)).padStart(2,"0")+"</span>";
}
function chgLine(d,base,label,money){
  const r=base?d/base:0, arrow=d>0?"▲":d<0?"▼":"";
  return `<span class="${cls(d)}">${arrow} ${n2.format(Math.abs(r*100))}%${money?" · "+money(Math.abs(d)):""}<small>${esc(label)}</small></span>`;
}
let heroState=null;
function benchAt(B,x){ let r=null; for(const p of B){ if(p.x<=x+1e-9) r=p.v; else break; } return r; }
function paintBm(a,b){  // a, b: {x,v} points on the portfolio curve
  const h=heroState, B=h&&h.bench, el=$("#bmLine"); if(!el) return;
  if(!B||B.length<2||!a||!b){ el.innerHTML=""; return; }  /* WLS % always shown; the switch only controls the chart line */
  const b0=benchAt(B,a.x)||B[0].v, b1=benchAt(B,b.x)||B[B.length-1].v;
  const br=b1/b0-1, pr=a.v?b.v/a.v-1:0, ex=pr-br;
  const arrow=br>0?"▲":br<0?"▼":"";  /* same form as the portfolio line above: arrow + % first, then what it is */
  el.innerHTML=`<span class="${cls(br)}">${arrow} ${n2.format(Math.abs(br*100))}%<small>WLS Index, same period</small></span>`;
}
let tween=null;
function paintHero(v,label,x){
  if(!heroState) return;
  if(v!=null){ tween=null; drawHero(v,label,x,v); return; }  // finger on the chart: value under the finger, no delay
  drawHero(null);
}
function drawHero(v,label,x,vPt){
  const h=heroState; if(!h) return;
  const val=v==null?(tween?tween.cur:h.tot):v;
  setHTML($("#total"),bigMoney(val));
  setHTML($("#chg"),chgLine(val-h.base,h.base,label||h.label,x=>usd2.format(x)));
  const P=h.pts; if(P&&P.length) paintBm({x:P[0].x,v:h.base}, v==null?P[P.length-1]:{x,v:vPt==null?v:vPt});
}
function renderHero(C,R){
  const prev=heroState&&heroState.tot, nt=C.now.total;
  if(prev!=null && Math.abs(nt-prev)>=0.5 && !RM()){
    const t0=performance.now(), D=700, from=tween?tween.cur:prev;
    tween={cur:from};
    const step=now=>{ if(!tween) return; const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3);
      tween.cur=from+(nt-from)*e; paintHero(); if(k<1) requestAnimationFrame(step); else { tween=null; paintHero(); } };
    requestAnimationFrame(step);
    retrigger($("#total"), nt>prev?"glow-up":"glow-down");
  }
  heroState={tot:C.now.total,base:R.base,label:R.label,bench:R.pts.length>1?benchSeries(R):null,pts:R.pts};
  paintHero();
  const up=S.market.latest&&S.market.latest.updated;
  $("#fresh").textContent = up ? (()=>{ const m=Math.round((Date.now()-Date.parse(up))/60000);
    return "Prices "+(m<90?m+" min ago":"from "+new Date(up).toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"}))+" · Yahoo Finance, ~15 min delayed"; })() : "";
}

/* ---------- benchmark (WLS proxy) ---------- */
function benchSeries(R){
  const B=S.market.latest&&S.market.latest.bench, H=S.market.history&&S.market.history.bench;
  if(!B && !H) return [];
  const x0=R.pts[0].x, x1=R.pts[R.pts.length-1].x;
  let src;
  if(R.intraday){ const key=(x1-x0)<=1.25?"i":"w"; src=((B&&B[key])||[]).map(b=>({x:b[0]/86400,v:b[1]})); }
  else { src=((H&&H.rows)||[]).map(r=>({x:dayNum(r[0]),v:r[2]})); if(B&&B.p&&B.d&&(!src.length||dayNum(B.d)>src[src.length-1].x)) src.push({x:dayNum(B.d),v:B.p}); }
  src=src.filter(p=>p.v>0).sort((a,b)=>a.x-b.x);
  const before=src.filter(p=>p.x<=x0).pop(), inR=src.filter(p=>p.x>x0&&p.x<=x1+1e-6);
  const s0=before||inR[0]; if(!s0) return [];
  const out=[{x:x0,v:s0.v},...inR]; const last=out[out.length-1];
  if(last.x<x1) out.push({x:x1,v:last.v});
  const b0=R.pts[0].v, gap=R.intraday?2/24:Infinity;
  const st=[]; out.forEach((p,i)=>{ const q=out[i-1]; if(q && p.x-q.x>gap) st.push({x:p.x-1/144,v:q.v}); st.push(p); });
  return st.map(p=>({x:p.x,v:b0*p.v/s0.v,raw:p.v}));
}

/* ---------- main chart ---------- */
let chartRangeNow=null, lastDrawKey=null;
function toggleBench(on){
  const from=chartRangeNow; S.showBench=on;
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!from||reduce||!lastC){ render(); return; }

function tzParts(tz,ms){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hourCycle:"h23"}).formatToParts(new Date(ms)).forEach(x=>o[x.type]=x.value); return o; }
/* epoch ms of a wall-clock time hh:mm on the market's current local date */
function wallToMs(tz,hhmm){
  const now=Date.now(), p=tzParts(tz,now), [h,m]=hhmm.split(":").map(Number);
  let guess=Date.UTC(+p.year,+p.month-1,+p.day,h,m);
  for(let i=0;i<2;i++){ const q=tzParts(tz,guess); const shown=Date.UTC(+q.year,+q.month-1,+q.day,+q.hour,+q.minute); guess+= Date.UTC(+p.year,+p.month-1,+p.day,h,m)-shown; }
  return guess;
}
const berlinHM = ms => new Date(ms).toLocaleTimeString("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"});
function marketState(M){
  const now=Date.now(), wd=tzParts(M.tz,now).weekday, weekend=wd==="Sat"||wd==="Sun";
  const o=wallToMs(M.tz,M.open), c=wallToMs(M.tz,M.close);
  const pre=M.pre?wallToMs(M.tz,M.pre):null, post=M.post?wallToMs(M.tz,M.post):null;
  let st="closed";
  if(!weekend){ if(now>=o&&now<c) st="open"; else if(pre&&now>=pre&&now<o) st="pre"; else if(post&&now>=c&&now<post) st="post"; }
  return {st,weekend,hours:berlinHM(o)+"–"+berlinHM(c),ext:pre?`pre-market from ${berlinHM(pre)}, after hours until ${berlinHM(post)}`:"",opensIn:!weekend&&now<o?o-now:null};
}

  }).sort((a,b)=>a.o-b.o).map(r=>r.html).join("");
  return `<section class="sec"><div class="sec-h"><h2>Market hours</h2><span>German time, today</span></div><div class="list">${rows}</div>

/* ---------- stop loss / take profit alerts ---------- */
/* first time a position's price touched its SL or TP after the fill; shown for 24 h from that moment */
function levelHits(C){
  const out=[], now=Date.now()/1000;
  for(const p of C.now.positions){
    const LV=S.levels[p.ticker], L=livePx()[p.ticker];
    if(!LV||!(p.shares>0)||!L) continue;
    const fill=Math.min(...effTrades().filter(t=>t.ticker===p.ticker&&t.side==="BUY"&&t.price>0).map(t=>t.effTs||dayNum(t.effDate)*86400));
    const bars=[...(L.w||[]),...(L.i||[])];
    if(L.t&&L.p) bars.push([Math.floor(Date.parse(L.t)/1000),L.p]);
    bars.sort((a,b)=>a[0]-b[0]);
    let hit=null;
    for(const [t,v] of bars){
      if(!(t>=fill)) continue;
      if(LV.stop>0&&v<=LV.stop){ hit={kind:"SL",ts:t,px:v,lvl:LV.stop}; break; }
      if(LV.target>0&&v>=LV.target){ hit={kind:"TP",ts:t,px:v,lvl:LV.target}; break; }
    }
    if(hit && now-hit.ts<86400) out.push(Object.assign(hit,{p}));
  }
  return out.sort((a,b)=>b.ts-a.ts);
}
function renderAlerts(C){
  const hits=levelHits(C); S.hits=Object.fromEntries(hits.map(h=>[h.p.ticker,h.kind]));
  const tab=document.querySelector('.tabs [data-tab="overview"]');
  if(tab){ tab.classList.toggle("alert",hits.length>0); tab.innerHTML=hits.length?'Positions <b class="bang" aria-label="alert">!</b>':"Positions"; }
  const box=$("#alerts"); if(!box) return;
  if(!hits.length){ box.innerHTML=""; return; }
  const nSL=hits.filter(h=>h.kind==="SL").length, nTP=hits.length-nSL;
  const head=[nSL?`Stop loss hit for ${nSL} stock${nSL>1?"s":""}`:"",nTP?`Take profit hit for ${nTP} stock${nTP>1?"s":""}`:""].filter(Boolean).join(" · ");
  box.innerHTML=`<section class="alertbox" role="alert"><div class="al-h"><span class="al-i" aria-hidden="true">!</span>${head}</div>
    ${hits.map(h=>`<button type="button" class="al-row" data-hit="${esc(h.p.ticker)}"><span class="al-k">${h.kind==="SL"?"STOP LOSS":"TAKE PROFIT"}</span>
      <span class="al-n">${esc(h.p.name||h.p.ticker)}</span>
      <span class="al-d num">${nPx(h.px)} ${h.kind==="SL"?"≤":"≥"} ${nPx(h.lvl)} ${esc(h.p.ccy)} · ${ago(h.ts)}</span></button>`).join("")}
    <div class="al-f">Review the position and place the trade in TMSG. This alert clears 24 h after the level was hit.</div></section>`;
  box.querySelectorAll("[data-hit]").forEach(b=>b.onclick=()=>{ if(C.now.positions.some(p=>p.ticker===b.dataset.hit)) openPosition(b.dataset.hit,C); });
}

/* compact SL → TP bar for the position list: dot = current price, tick = entry */
function miniGauge(p){
  const LV=S.levels[p.ticker], px=p.px;
  if(!LV||!(LV.target>LV.stop)||!(px>0)) return `<div class="mg mg-none"></div>`;
  const pos=v=>Math.max(0,Math.min(100,(v-LV.stop)/(LV.target-LV.stop)*100));
  const fills=effTrades().filter(t=>t.ticker===p.ticker&&t.side==="BUY"&&t.price>0);
  const entry=fills.length?fills.reduce((a,t)=>a+t.price*(+t.usd||0),0)/fills.reduce((a,t)=>a+(+t.usd||0),0):null;
  const ds=LV.stop/px-1, dt=LV.target/px-1;
  /* within 3% of a level: the panel takes that level's colour */
  const near=ds>-0.03?" near-sl":dt<0.03?" near-tp":"";
  return `<div class="mg${near}" title="SL ${nPx(LV.stop)} (${fmtPct(ds)}) · TP ${nPx(LV.target)} (${fmtPct(dt)})">

    <div class="mg-bar">${entry?`<i class="mg-entry" style="left:${pos(entry)}%"></i>`:""}<i class="mg-dot" style="left:${pos(px)}%"></i></div>

/* ---------- position detail ---------- */
const fmtLocal=(v,ccy)=>{ const a=Math.abs(v), d=a>=1000?0:(a>=1||a===0?2:4);  /* fixed decimals so gliding figures don't flicker */
  return new Intl.NumberFormat("en-US",{style:"currency",currency:ccy||"USD",minimumFractionDigits:d,maximumFractionDigits:d}).format(v); };
function stockSeries(tk){
  const L=livePx()[tk], r=S.stockRange;
  if(r==="1d"){
    const bars=(L&&L.i)||[]; if(bars.length<2) return {pts:[]};
    const lastTs=bars[bars.length-1][0];
    const pts=bars.filter(b=>b[0]>lastTs-16*3600).map(b=>({x:b[0]/86400,v:b[1],label:dhm(b[0])}));
    return {pts,base:L.prev>0?L.prev:pts[0].v,label:L.d===today()?"today":fmtDate(L.d),intraday:true};
  }
  const intra=(arr,days,label)=>{ const lastTs=arr[arr.length-1][0];
    const pts=arr.filter(b=>b[0]>=lastTs-days*86400).map(b=>({x:b[0]/86400,v:b[1],label:days>7?new Date(b[0]*1000).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):dhm(b[0])}));
    return {pts,base:pts[0].v,label,intraday:true}; };
  if(r==="1w" && L && L.w && L.w.length>=2) return intra(L.w,7,"1 week");
  if(r==="1m" && L && L.m && L.m.length>=2) return intra(L.m,31,"1 month");
  let pts=(feedPx()[tk]||[]).map(q=>({x:dayNum(q[0]),v:q[2],date:q[0],label:fmtDate(q[0])+" "+q[0].slice(0,4)}));
  if(L && (!pts.length || L.d>pts[pts.length-1].date)) pts.push({x:dayNum(L.d),v:L.p,date:L.d,label:fmtDate(L.d)+" "+L.d.slice(0,4)});
  const days={"1w":7,"1m":31,"1y":366}[r];
  if(days){ const cut=dayNum(today())-days; const inR=pts.filter(p=>p.x>=cut), before=pts.filter(p=>p.x<cut).pop(); pts=before?[before,...inR]:inR; }
  if(r==="ytd"){ const y0=today().slice(0,4)+"-01-01"; const inR=pts.filter(p=>p.date>=y0), before=pts.filter(p=>p.date<y0).pop(); pts=before?[before,...inR]:inR; }
  const label = r==="max" ? (pts.length?"since "+pts[0].label:"") : {"1w":"1 week","1m":"1 month","1y":"1 year","ytd":"this year"}[r];
  return {pts,base:pts.length?pts[0].v:0,label,intraday:false};
}

/* ---------- upcoming company events (earnings, dividends) ---------- */
const berlinDate = ms => new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(ms));
const dnum = d => Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/86400000;
function eventsFor(tk){ const t=berlinDate(Date.now()); return (((S.events&&S.events.items)||{})[tk]||[]).filter(e=>e.date>=t).sort((a,b)=>a.date<b.date?-1:1); }
function eventRow(e,tk){
  const code=tk.split(" ").pop(), M=MARKETS.find(m=>m.codes.includes(code));
  const days=dnum(e.date)-dnum(berlinDate(Date.now()));
  const d=new Date(Date.UTC(+e.date.slice(0,4),+e.date.slice(5,7)-1,+e.date.slice(8,10),12));
  const wd=d.toLocaleDateString("en-GB",{weekday:"short",timeZone:"UTC"}), mon=d.toLocaleDateString("en-GB",{month:"short",timeZone:"UTC"});
  const when=days<=0?"Today":days===1?"Tomorrow":"in "+days+" days";
  const after=S.settings.end&&e.date>S.settings.end;
  /* Yahoo's dividend amount can be in the declaring currency (e.g. USD for CMB.TECH), so no currency sign */
  const amt=e.amount>0?n2.format(e.amount):"";
  const US=M&&M.name==="New York";  /* Yahoo's release times are reliable for US stocks only */
  let title="", sub=[];
  if(e.type==="earnings"){
    title=e.title?esc(e.title):"Earnings release";
    if(e.timeKnown&&e.ts&&US){
      const lt=tzParts(M.tz,e.ts*1000), hm=lt.hour+":"+lt.minute, rel=hm<M.open?"before the market opens":hm>=M.close?"after the market closes":"during trading";
      sub.push(`${wd}, ${rel} · ${berlinHM(e.ts*1000)} German time`);
    } else if(e.estimate&&e.range){
      const r=e.range.map(x=>new Date(x+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"}));
      sub.push(`Expected ${r[0]}–${r[1]}, date not confirmed yet`);
    } else sub.push(e.estimate?`${wd} · date not confirmed yet`:`${wd} · exact time not published`);
    if(e.eps!=null){ let f; try{ f=new Intl.NumberFormat("en-US",{style:"currency",currency:e.ccy||"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(e.eps); }catch(_){ f=n2.format(e.eps); }
      sub.push(`analysts expect EPS of ${esc(f)}`); }
    if(e.source) sub.push(`<a href="${esc(e.source)}" target="_blank" rel="noopener noreferrer" style="color:inherit">confirmed by the company</a>`);
  } else if(e.type==="exdiv"){
    title="Ex-dividend day";
    sub.push(`${wd} · only shares held before this day get the dividend`+(amt?` · last dividend ${amt} per share`:""));
  } else if(e.type==="divpay"){
    title="Dividend payment";
    sub.push(`${wd}`+(amt?` · last dividend ${amt} per share`:""));
  } else return "";
  return `<div class="row ev${e.type==="earnings"?" earn":""}"><div class="ev-d"><small>${mon}</small><b>${d.getUTCDate()}</b></div>
    <div class="r-name">${title}</div><div class="ev-w${days<=7&&!after?" soon":""}">${after?'<span class="ev-after">after challenge</span>':when}</div>
    <div class="r-sub">${sub.join(" · ")}</div></div>`;
}

  const ev=eventsFor(tk);

    <div class="list" style="box-shadow:none;border:1px solid var(--line);margin-top:14px">${ev.length?ev.map(e=>eventRow(e,tk)).join(""):

    if(li){ if(LV&&S.showLevels){
        const px=(L&&L.p)||cur, ds=LV.stop/px-1, dt=LV.target/px-1;
        const span=LV.target-LV.stop, pos=v=>Math.max(0,Math.min(100,(v-LV.stop)/span*100));
        const fills=effTrades().filter(t=>t.ticker===tk&&t.side==="BUY"&&t.price>0), entry=fills.length?fills.reduce((a,t)=>a+t.price*(+t.usd||0),0)/fills.reduce((a,t)=>a+(+t.usd||0),0):null;
        const hit=px<=LV.stop?'<span class="pill sell">STOP HIT</span>':px>=LV.target?'<span class="pill buy">TARGET HIT</span>':"";
        const cp=pos(px), al=cp<18?"left":cp>82?"right":"center";
        li.innerHTML=`<div class="gauge${gIn&&!RM()?" in":""}">
          <div class="g-now num" style="left:${cp}%;text-align:${al};transform:translateX(${al==="left"?"-6px":al==="right"?"calc(-100% + 6px)":"-50%"})">${hit||esc(fmtLocal(px,p.ccy))}</div>
          <div class="g-bar"><i class="g-dot" style="left:${cp}%"></i>${entry?`<i class="g-entry" style="left:${pos(entry)}%" title="entry"></i>`:""}</div>
          <div class="g-ends num"><span class="down"><span>SL ${esc(fmtLocal(LV.stop,p.ccy))}</span><b>${fmtPct(ds)}</b></span><span class="flat">${entry?`<span>Entry</span><span>${esc(fmtLocal(entry,p.ccy))}</span>`:""}</span><span class="up"><span>TP ${esc(fmtLocal(LV.target,p.ccy))}</span><b>${fmtPct(dt)}</b></span></div></div>`;
      } else li.innerHTML=`<div class="g-off">See how close the price is to your stop loss and take profit.</div>`;
      if(gIn) retrigger(li,"swap"); }
    const dk2=tk+"|"+S.stockRange; const drawIn2=dk2!==stockDrawKey; stockDrawKey=dk2;
    lineChart(box,s.pts,s.base,{h:180,drawIn:drawIn2,markers:marks,levels,levelsIn:lvIn,aria:tk+" price",onScrub:q=>paint(q.v,q.label),onLeave:()=>paint(),
      onRange:(a,b)=>{ setHTML($("#sBig"),esc(fmtLocal(b.v,p.ccy))); setHTML($("#sChg"),chgLine(b.v-a.v,a.v,a.label+" → "+b.label,x=>fmtLocal(x,p.ccy))); }});
    $("#sNote").innerHTML = (marks.length?'<span style="color:var(--accent)">●</span> your fill · ':"")+"Prices in "+esc(p.ccy)+({"1d":", 10-min steps","1w":", hourly steps","1m":", 4-hour steps","ytd":", daily closes","1y":", daily closes","max":", daily closes"}[S.stockRange]||"");
  };
  document.querySelectorAll("#sRanges button").forEach(b=>b.onclick=()=>{ S.stockRange=b.dataset.r; try{localStorage.setItem("gtc.srange",S.stockRange);}catch(e){} draw(); });
  const lt=$("#lvT"); if(lt) lt.onchange=()=>{ S.showLevels=lt.checked;  /* on by default every time the site opens */
    if(lt.checked||RM()){ gaugeAnim=true; levelsAnim=true; draw(); return; }
    const lv=document.querySelector("#sChart svg .lvl"); if(lv) lv.classList.add("lv-out");  /* fade the lines out, then redraw */
    const li=$("#lvInfo"); if(li) li.style.cssText="transition:opacity .16s;opacity:0";
    setTimeout(()=>{ if(li) li.style.cssText=""; gaugeAnim=true; draw(); },170); };
  draw();
  sheetRefresh=C2=>{ const q=C2.now.positions.find(x=>x.ticker===tk); if(!q) return;
    L=livePx()[tk];
    const st=$("#sStats"), h=statsHTML(q,C2); if(st && st.__h!==h){ st.outerHTML=h; const n=$("#sStats"); if(n) n.__h=h; }
    const se=$("#sEvents"), eh=eventsHTML(tk); if(se && eh && se.__h!==eh){ se.outerHTML=eh; const n=$("#sEvents"); if(n) n.__h=eh; }
    draw(); };
}

/* ---------- trade form ---------- */
function latestFx(ccy){ if(ccy==="USD") return 1; const o=lastC&&lastC.obs.fx[ccy]; return o&&o.length?o[o.length-1].v:null; }
function latestPx(tk){ const o=lastC&&lastC.obs.px[tk]; return o&&o.length?o[o.length-1].v:null; }
function knownTickers(){ const m={}; for(const t of sortedTrades()) m[t.ticker]={name:t.name,ccy:t.ccy}; return m; }

function openTrade(t, preset){
  const edit=!!t; t = t || Object.assign({side:"BUY",date:today(),ticker:"",name:"",ccy:"",usd:100000,price:null,fx:null,shares:null,note:""},preset||{});
  let side=t.side;
  const known=knownTickers();
  const held = lastC? Object.fromEntries(lastC.now.positions.map(p=>[p.ticker,p.shares])) : {};
  openModal(`<h3>${edit?"Edit trade":"New trade"}</h3>
    <div class="seg" id="side"><button type="button" data-s="BUY">Buy</button><button type="button" data-s="SELL">Sell</button></div>
    <form id="tf" novalidate style="display:flex;flex-direction:column;gap:12px">
      <div class="grid2">
        <label class="f">Ticker <span class="hint">as in TMSG, e.g. OERL SE</span><input id="f_tk" list="tkl" autocomplete="off" autocapitalize="characters" value="${esc(t.ticker)}" required></label>
        <label class="f">Date<input id="f_date" type="date" value="${esc(t.date)}" required></label>
      </div>
      <datalist id="tkl">${Object.keys(known).map(k=>`<option value="${esc(k)}">${esc(known[k].name||"")}</option>`).join("")}</datalist>
      <div class="grid2">
        <label class="f">Name<input id="f_name" value="${esc(t.name)}" autocomplete="off"></label>
        <label class="f">Currency<input id="f_ccy" value="${esc(t.ccy)}" maxlength="3" autocapitalize="characters" autocomplete="off"></label>
      </div>
      <div class="grid2" id="buyF">
        <label class="f">Amount (USD)<input id="f_usd" inputmode="decimal" value="${t.usd!=null?esc(t.usd):""}"></label>
        <label class="f">Fill price <span class="hint" id="pxh">local currency · leave empty if not filled yet</span><input id="f_px" inputmode="decimal" value="${t.price!=null?esc(t.price):""}"></label>
      </div>
      <div class="grid2" id="sellF">
        <label class="f">Shares <span class="hint" id="heldH"></span><input id="f_sh" inputmode="decimal" value="${t.shares!=null?esc(t.shares):""}"></label>
        <label class="f">Sell price <span class="hint">local currency</span><input id="f_spx" inputmode="decimal" value="${t.price!=null?esc(t.price):""}"></label>
      </div>
      <label class="f" id="fxF">FX rate <span class="hint" id="fxh"></span><input id="f_fx" inputmode="decimal" value="${t.fx!=null?esc(t.fx):""}"></label>
      <label class="f">Note<input id="f_note" value="${esc(t.note||"")}" autocomplete="off" placeholder="Why this trade"></label>
      <div class="calc num" id="calc"></div>
      <div class="err" id="ferr" role="alert"></div>
      <div class="actions">${edit?`<button type="button" class="btn danger" id="del">Delete</button>`:""}<span class="grow"></span><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary" id="save">Save</button></div>
    </form>`);
  const g=id=>document.getElementById(id);
  const setSide=s=>{ side=s; document.querySelectorAll("#side button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===s))); slidePill($("#side"),'[aria-pressed="true"]'); g("buyF").hidden=s!=="BUY"; g("sellF").hidden=s!=="SELL"; upd(); };
  document.querySelectorAll("#side button").forEach(b=>b.onclick=()=>setSide(b.dataset.s));
  g("f_tk").addEventListener("input",()=>{
    const k=g("f_tk").value.trim().toUpperCase().replace(/\s+EQUITY$/,"");
    if(known[k]){ g("f_name").value=known[k].name||""; g("f_ccy").value=known[k].ccy||""; }
    else if(!g("f_ccy").value || !edit){ const c=guessCcy(k); if(c) g("f_ccy").value=c; }
    if(!g("f_fx").value){ const f=latestFx(g("f_ccy").value.trim().toUpperCase()); if(f) g("f_fx").value=f; }
    upd();
  });
  g("f_ccy").addEventListener("input",()=>{ const f=latestFx(g("f_ccy").value.trim().toUpperCase()); if(f && !edit) g("f_fx").value=f; upd(); });
  ["f_usd","f_px","f_sh","f_spx","f_fx"].forEach(id=>g(id).addEventListener("input",upd));
  function upd(){
    const ccy=g("f_ccy").value.trim().toUpperCase();
    const isUsd=ccy==="USD"||ccy==="";
    g("fxF").hidden=isUsd;
    g("fxh").textContent = ccy && !isUsd ? `USD per 1 ${ccy}${ccy==="GBP"?" (price in pounds, not pence)":""}` : "";
    const tk=g("f_tk").value.trim().toUpperCase();
    const h=held[tk]; g("heldH").innerHTML = h>0? `you hold ${nSh(h)} · <a href="#" id="all">sell all</a>`:"";
    const a=document.getElementById("all"); if(a) a.onclick=e=>{e.preventDefault(); g("f_sh").value=+h.toFixed(6); upd();};
    const fx=isUsd?1:num(g("f_fx").value);
    let out="";
    if(side==="BUY"){
      const usd=num(g("f_usd").value), px=num(g("f_px").value);
      if(usd>0 && px>0 && fx>0) out=`≈ ${nSh(usd/(px*fx))} shares at ${usd2.format(px*fx)} each`;
      else if(usd>0) out=`Counts at cost (${usd0.format(usd)}) until you add the fill price.`;
    } else {
      const sh=num(g("f_sh").value), px=num(g("f_spx").value);
      if(sh>0 && px>0 && fx>0){
        const p=lastC&&lastC.now.positions.find(x=>x.ticker===tk);
        const proceeds=sh*px*fx; let pl="";
        if(p&&p.shares>0){ const r=proceeds-(p.cost/p.shares)*sh; pl=` · <span class="${cls(r)}">${fmtUsdS(r)} realized</span>`; }
        out=`Proceeds ${usd2.format(proceeds)}${pl}`;
      }
    }
    g("calc").innerHTML=out; g("calc").hidden=!out;
  }
  setSide(side);
  g("cancel").onclick=closeModal;
  if(edit){
    let armed=false;
    g("del").onclick=async()=>{
      if(!armed){ armed=true; g("del").textContent="Tap again to delete"; return; }
      try{ await S.db.collection("trades").doc(t.id).delete(); closeModal(); toast("Trade deleted"); }catch(e){ g("ferr").textContent=dbErr(e); }
    };
  }
  g("tf").addEventListener("submit",async e=>{
    e.preventDefault();
    const tk=g("f_tk").value.trim().toUpperCase().replace(/\s+EQUITY$/,"").replace(/\s+/g," ");
    const ccy=(g("f_ccy").value.trim().toUpperCase()||guessCcy(tk));
    const date=g("f_date").value;
    const fx= ccy==="USD"?1:num(g("f_fx").value);
    const err=m=>{ g("ferr").textContent=m; };
    if(!tk) return err("Enter a ticker.");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err("Pick a date.");
    if(!/^[A-Z]{3}$/.test(ccy)) return err("Enter the 3-letter currency, e.g. EUR.");
    const body={side,ticker:tk,name:g("f_name").value.trim()||tk,ccy,date,note:g("f_note").value.trim(),fx: fx>0?fx:null};
    if(side==="BUY"){
      const usd=num(g("f_usd").value), px=num(g("f_px").value);
      if(!(usd>0)) return err("Enter the USD amount.");
      if(px!=null && !(px>0)) return err("The fill price must be a positive number.");
      if(px>0 && !(fx>0)) return err(`Enter the FX rate (USD per 1 ${ccy}).`);
      Object.assign(body,{usd,price:px,shares:null});
    } else {
      const sh=num(g("f_sh").value), px=num(g("f_spx").value);
      if(!(sh>0)) return err("Enter how many shares you sold.");
      if(!(px>0)) return err("Enter the sell price.");
      if(!(fx>0)) return err(`Enter the FX rate (USD per 1 ${ccy}).`);
      const h=held[tk]||0; const own = edit && t.side==="SELL" ? (+t.shares||0) : 0;
      if(sh>h+own+1e-6) return err(`You only hold ${nSh(h+own)} shares of ${tk}.`);
      Object.assign(body,{shares:sh,price:px,usd:null});
    }
    g("save").disabled=true;
    try{
      if(edit){ await S.db.collection("trades").doc(t.id).set(Object.assign({},t,body,{updatedAt:new Date().toISOString()})); }
      else {
        const ref=S.db.collection("trades").doc();
        await ref.set(Object.assign(body,{id:ref.id,createdAt:new Date().toISOString(),by:S.myId||null}));
      }
      closeModal(); toast(edit?"Trade updated":"Trade saved");
    }catch(ex){ g("save").disabled=false; err(dbErr(ex)); }
  });
}

/* ---------- prices form ---------- */
function openPrices(C,date){
  const existing=S.prices.find(p=>p.date===date)||{px:{},fx:{}};
  const run_=run(date,C.obs);
  const tks=[...new Set([...run_.positions.map(p=>p.ticker), ...C.now.positions.map(p=>p.ticker), ...Object.keys(existing.px||{})])];
  const meta={}; C.now.positions.concat(run_.positions).forEach(p=>meta[p.ticker]={name:p.name,ccy:p.ccy});
  const ccys=[...new Set(tks.map(t=>(meta[t]||{}).ccy).filter(c=>c&&c!=="USD"))].sort();
  const lastPx=tk=>{ const o=at(C.obs.px[tk],date); return o?o.v:null; };
  const lastFx=c=>{ const o=at(C.obs.fx[c],date)||(C.obs.fx[c]||[]).slice(-1)[0]; return o?o.v:null; };
  openModal(`<h3>Prices</h3>
    <form id="pf" novalidate style="display:flex;flex-direction:column;gap:12px">
      <label class="f">Price date<input id="p_date" type="date" value="${esc(date)}"></label>
      <div>
        <div class="eyebrow">Close in local currency</div>
        ${tks.map((tk,i)=>{ const m=meta[tk]||{}; const v=existing.px&&existing.px[tk]; const lp=lastPx(tk);
          return `<div class="pxrow"><label for="px_${i}" style="min-width:0"><div class="r-name">${esc(m.name||tk)}</div><div class="r-sub"><span class="tk">${esc(tk)}</span><span>${esc(m.ccy||"")}${lp?` · last ${nPx(lp)}`:""}</span></div></label>
          <input id="px_${i}" data-tk="${esc(tk)}" inputmode="decimal" placeholder="${lp?esc(nPx(lp)):"price"}" value="${v?esc(v):""}"></div>`; }).join("")||'<p class="foot">No open positions on this date.</p>'}
      </div>
      ${ccys.length?`<div><div class="eyebrow">FX · USD per 1 unit</div>
        ${ccys.map((c,i)=>{ const v=(existing.fx&&existing.fx[c])||lastFx(c);
          return `<div class="pxrow"><label for="fx_${i}"><div class="r-name mono">${esc(c)}USD</div><div class="r-sub">1 ${esc(c)} = ? USD</div></label><input id="fx_${i}" data-c="${esc(c)}" inputmode="decimal" value="${v?esc(v):""}"></div>`; }).join("")}</div>`:""}
      <div class="pxrow"><label for="p_bench"><div class="r-name">WLS Index</div><div class="r-sub">optional · for the benchmark line</div></label><input id="p_bench" inputmode="decimal" value="${existing.bench?esc(existing.bench):""}"></div>
      <div class="err" id="perr" role="alert"></div>
      <div class="actions">${S.prices.find(p=>p.date===date)?`<button type="button" class="btn danger" id="pdel">Delete day</button>`:""}<span class="grow"></span><button type="button" class="btn" id="pcancel">Cancel</button><button type="submit" class="btn primary" id="psave">Save prices</button></div>
    </form>`);
  const g=id=>document.getElementById(id);
  g("pcancel").onclick=closeModal;
  const del=g("pdel"); if(del){ let armed=false; del.onclick=async()=>{ if(!armed){armed=true;del.textContent="Tap again to delete";return;} try{ await S.db.collection("prices").doc(date).delete(); closeModal(); toast("Price day deleted"); }catch(e){ g("perr").textContent=dbErr(e);} }; }
  g("pf").addEventListener("submit",async e=>{
    e.preventDefault();
    const d=g("p_date").value; if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ g("perr").textContent="Pick a date."; return; }
    const base=S.prices.find(p=>p.date===d)||{};
    const px=Object.assign({}, d===date?{}:(base.px||{})), fx=Object.assign({}, d===date?{}:(base.fx||{}));
    let bad="";
    document.querySelectorAll("[data-tk]").forEach(i=>{ const v=num(i.value); if(i.value.trim()&&!(v>0)) bad="Prices must be positive numbers."; if(v>0) px[i.dataset.tk]=v; });
    document.querySelectorAll("[data-c]").forEach(i=>{ const v=num(i.value); if(i.value.trim()&&!(v>0)) bad="FX rates must be positive numbers."; if(v>0) fx[i.dataset.c]=v; });
    const b=num(g("p_bench").value);
    if(bad){ g("perr").textContent=bad; return; }
    if(!Object.keys(px).length && !(b>0)){ g("perr").textContent="Enter at least one price."; return; }
    g("psave").disabled=true;
    try{
      await S.db.collection("prices").doc(d).set({date:d,px,fx,bench:b>0?b:(d===date?null:(base.bench||null)),by:S.myId||null,updatedAt:new Date().toISOString()});
      if(d!==date && S.prices.find(p=>p.date===date)) await S.db.collection("prices").doc(date).delete();
      closeModal(); toast("Prices saved");
    }catch(ex){ g("psave").disabled=false; g("perr").textContent=dbErr(ex); }
  });
}

    <label class="f">Book name<input id="s_name" value="${esc(s.name||"")}"></label>

  });
}

/* ---------- boot ---------- */
render();
/* Public read-only copy (GitHub Pages): same page, data from JSON files next to it */
async function staticBoot(){
  S.canWrite=false;
  const get=async f=>{ try{ const r=await fetch("data/"+f+"?t="+Date.now(),{cache:"no-store"}); return r.ok? await r.json():null; }catch(e){ return null; } };
  const load=async()=>{
    const [tr,st,pr,la,hi,nw,lv,ev]=await Promise.all(["trades.json","settings.json","prices.json","latest.json","history.json","news.json","levels.json","events.json"].map(get));
    /* a file that fails to load (e.g. while GitHub is publishing) keeps its last good copy */
    if(nw) S.news=nw; if(ev) S.events=ev; if(lv) S.levels=lv; else S.levels=S.levels||{};
    if(!Array.isArray(tr)){ if(!S.got.trades){ S.dbState="none"; render(); } return false; }
    S.trades=tr; if(Array.isArray(pr)) S.prices=pr; else S.prices=S.prices||[]; if(st) S.settings=Object.assign({},S.settings,st);
    S.market={latest:la||S.market.latest,history:hi||S.market.history}; S.got={trades:true,prices:true}; S.dbState="ok";
    $("#foot").textContent="Read-only view. Values in USD, prices from Yahoo Finance (~15 min delayed), new prices every ~6 minutes.";
    if(!document.querySelector("#nfPop:not([hidden])")) renderSoon();  // don't close the stock picker mid-search
    return !!(la && hi);
  };
  // live updates: poll a tiny stamp file; reload the data only when it changed
  let stamp=null, first=true, busy=false;
  const check=async()=>{
    const st=await get("stamp.json");
    const now=st&&st.updated;
    if(now && now===stamp) { if(lastC && !scrubbing && !scrollingNow() && !document.querySelector("#nfPop:not([hidden])")) renderHero(lastC,rangePoints(lastC)); return; }
    if(busy) return; busy=true;
    let ok=false; try{ ok=await load(); }catch(e){} busy=false;
    if(!ok) return;  /* try again on the next check */
    if(!first && now && now!==stamp) toast("Prices updated");
    stamp=now||stamp; first=false;
  };
  await check();
  setInterval(()=>{ if(!document.hidden) check(); },30*1000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); });
  window.addEventListener("focus",check);
}
(async()=>{
  const cl=window.claude;
  if(!cl || !cl.use){ staticBoot(); return; }
  const [db,user]=await Promise.all([cl.use("db").catch(()=>null), cl.use("user").catch(()=>null)]);
  if(!db){ staticBoot(); return; }
  S.db=db; S.user=user; S.dbState="ok";
  if(user){
    try{ S.myId=await user.id(); }catch(e){}
    try{ const c=await user.can("data.write"); if(c===false) S.canWrite=false; }catch(e){}
  }
  const onErr=e=>{ if(e&&e.code==="revoked"){ S.dbState="none"; render(); } };
  db.collection("trades").onSnapshot(s=>{ S.trades=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})); S.got.trades=true; render(); }, onErr);
  db.collection("prices").onSnapshot(s=>{ S.prices=s.docs.map(d=>Object.assign({},d.data(),{date:d.id})); S.got.prices=true; render(); }, onErr);
  db.collection("market").onSnapshot(s=>{ const m={latest:null,history:null}; s.docs.forEach(d=>{ if(d.id in m) m[d.id]=d.data(); }); S.market=m; render(); }, onErr);
  db.doc("settings/levels").onSnapshot(s=>{ S.levels=s.exists?(s.data()||{}):{}; render(); }, onErr);
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists) S.settings=Object.assign({},S.settings,s.data()); render(); }, onErr);
})();
})();
