name: prices
on:
  # started every 6 minutes by cron-job.org (GitHub's own scheduler proved unreliable)
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: python fetch_prices.py
      - run: python news.py || echo "news step failed, prices still saved"
      - run: python summarize.py || echo "summary step failed, prices and news still saved"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/ tickers.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs --quiet origin main && git push --quiet && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1
