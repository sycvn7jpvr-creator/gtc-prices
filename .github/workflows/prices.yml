name: prices
on:
  # PRIVATE MODE: GitHub's own hourly schedule (2,000 free Actions minutes/month for private repos).
  # No workflow_dispatch, so the 6-minute calls from cron-job.org are refused and cost nothing.
  # To go back to public mode: replace the schedule with "workflow_dispatch:" again.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026, mid-challenge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: python fetch_prices.py
      - run: python exits.py || echo "exits step failed, prices still saved"
      - run: python news.py || echo "news step failed, prices still saved"
      - run: python events.py || echo "events step failed, prices still saved"
      # FinBERT news mood: the model (~400 MB) is kept between runs; torch/transformers are only
      # installed when there are new headlines to score, so most runs skip this in a second
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosusai-v1
      - name: News mood (FinBERT)
        run: |
          (
            if python sentiment.py --need; then
              pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
              pip install --quiet "transformers>=4.40,<5"
            fi
            python sentiment.py
          ) || echo "sentiment step failed, prices still saved"
      - name: Commit prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/ tickers.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          # another push (e.g. a website update) can land at the same moment: rebase and retry.
          # "|| true": the runner's shell stops on any error, and "rebase --abort" errors when no rebase is open
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs --quiet origin main && git push --quiet; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
