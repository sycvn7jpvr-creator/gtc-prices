name: prices
on:
  # started every 6 minutes by cron-job.org (GitHub's own scheduler proved unreliable)
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026, mid-challenge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: python fetch_prices.py
      - run: python news.py || echo "news step failed, prices still saved"
      - run: python events.py || echo "events step failed, prices still saved"
      - name: Commit prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/ tickers.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          # another push (e.g. a website update) can land at the same moment: rebase and retry.
          # "|| true": the runner's shell stops on any error, and "rebase --abort" errors when no rebase is open
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs --quiet origin main && git push --quiet; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          exit 1
